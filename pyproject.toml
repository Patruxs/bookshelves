[tool.ruff]
line-length = 120
target-version = "py311"
src = ["scripts", "tests"]
extend-exclude = ["venv", "web"]

[tool.ruff.lint]
select = ["F", "B", "I", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "scripts"
explicit_package_bases = true
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["docx", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
